[package]
name = "lazy-manda"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
jni = { version = "0.21", features = ["libloading"] }
once_cell = "1.19"
libloading = "0.8"
walkdir = "2"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_LibraryLoader"] }
